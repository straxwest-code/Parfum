<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#E2E8F0;
    --text:#0F172A; --muted:#64748B; --gold:#C59B27; --gold-dark:#9A7618;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter', sans-serif;}
  .app-root{padding:20px 16px 50px;max-width:640px;margin:0 auto;}
  
  .header{text-align:center;margin-bottom:20px;}
  .header-icon{font-size:32px;margin-bottom:4px;}
  .header h1{font-family:'Playfair Display', serif;font-weight:700;font-size:24px;margin:0;color:var(--text);}
  .header p{margin:4px 0 0;font-size:13px;color:var(--muted);}

  .filter-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 3px 10px rgba(0,0,0,0.03);}
  
  .form-group{margin-bottom:12px;}
  .label-group{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:6px;display:block;}
  
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  
  select, input[type="text"]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13.5px;font-family:'Inter', sans-serif;outline:none;transition:border-color .15s;}
  select:focus, input[type="text"]:focus{border-color:var(--gold);}
  
  .results-meta{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;}
  .results-title{font-family:'Playfair Display', serif;font-size:18px;font-weight:700;margin:0;}
  .results-count{font-size:12.5px;color:var(--muted);}

  .perfume-list{display:flex;flex-direction:column;gap:10px;}
  .perfume-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,0.02);animation:fadeIn 0.2s ease;}
  
  .perfume-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .perfume-name{font-family:'Playfair Display', serif;font-weight:700;font-size:16.5px;margin:0;color:var(--text);}
  .perfume-brand{font-size:12.5px;color:var(--gold-dark);font-weight:600;margin-top:1px;}
  .badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#FFFFFF;border:1px solid var(--line);white-space:nowrap;}

  .perfume-notes{font-size:12px;color:var(--text);margin:6px 0;line-height:1.4;}
  .perfume-desc{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 8px;}
  
  .tags-row{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#FFFFFF;border:1px solid var(--line);color:var(--muted);}
  .tag.season{background:rgba(197,155,39,0.08);color:var(--gold-dark);border-color:rgba(197,155,39,0.2);font-weight:500;}
  .tag.niche{background:rgba(13,148,136,0.08);color:#0D9488;border-color:rgba(13,148,136,0.2);font-weight:600;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .empty-state{text-align:center;padding:30px 16px;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:14px;}
</style>

        </select>

    </div>

  </div>

</div>

function filterPerfumes(){
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const family = document.getElementById('familySelect').value;
  const gender = document.getElementById('genderSelect').value;
  const season = document.getElementById('seasonSelect').value;
  const type = document.getElementById('typeSelect').value;

  const results = PERFUMES.filter(p => {
    const matchFamily = (family === 'all' || p.family === family);
    const matchGender = (gender === 'all' || p.gender === gender || p.gender === 'Unisexe');
    const matchSeason = (season === 'all' || p.seasons.includes(season));
    const matchType = (type === 'all' || p.type === type);

    const matchQuery = !query || 
      p.name.toLowerCase().includes(query) ||
      p.brand.toLowerCase().includes(query) ||
      p.notes.toLowerCase().includes(query) ||
      p.desc.toLowerCase().includes(query);

    return matchFamily && matchGender && matchSeason && matchType && matchQuery;
  });

  renderResults(results);
}

  countEl.textContent = `${list.length} référence${list.length > 1 ? 's' : ''}`;

  if(list.length === 0){
    area.innerHTML = '<div class="empty-state">Aucun parfum ne correspond à vos critères. Essayez d\'élargir les filtres ou de modifier votre mot-clé.</div>';
    return;
  }

  let html = '<div class="perfume-list">';

  list.forEach(p => {
    html += `
      <div class="perfume-card">
        <div class="perfume-top">
          <div>
            <h3 class="perfume-name">${p.name}</h3>
            <div class="perfume-brand">${p.brand}</div>
          </div>
          <span class="badge">${p.gender}</span>
        </div>
        <div class="perfume-notes"><b>Notes :</b> ${p.notes}</div>
        <p class="perfume-desc">${p.desc}</p>
        <div class="tags-row">
          <span class="tag">${p.familyLabel}</span>
          ${p.type === 'niche' ? '<span class="tag niche">Maison de Niche</span>' : '<span class="tag">Grande Maison</span>'}
          ${p.seasons.map(s => `<span class="tag season">☀️ ${s}</span>`).join('')}
          <span class="tag">📍 ${p.occasion}</span>
        </div>
      </div>
    `;
  });

  html += '</div>';
  area.innerHTML = html;
}

window.addEventListener('load', () => {
  filterPerfumes();
});
</script>
</body>
</html>
